# 依照 ~/.config/ghostty/config 轉換，適用 kitty 0.49.2。
# 配色直接取自本機 Ghostty 的 TokyoNight Night 主題。

# ── 背景與配色 ─────────────────────────────────────────────
background #1a1b26
foreground #c0caf5
background_opacity 0.98
selection_background #283457
selection_foreground #c0caf5
cursor #c0caf5
cursor_text_color #1a1b26

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ── 字體 ───────────────────────────────────────────────────
# Ghostty 未指定 font-family，預設內建 JetBrains Mono。
# kitty 使用本機已安裝的 Nerd Font Mono 版本，保留程式字體與圖示。
# Ghostty 的 font-thicken 在 Linux 無效，因此這裡維持正常字重。
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
modify_font cell_height 105%

# ── 視窗、分頁與光標 ───────────────────────────────────────
window_padding_width 1
remember_window_size yes
resize_in_steps no
enabled_layouts splits,stack
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_background #1a1b26
active_tab_foreground #c0caf5
active_tab_background #283457
inactive_tab_foreground #a9b1d6
inactive_tab_background #1a1b26
active_border_color #7aa2f7
inactive_border_color #414868
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
mouse_hide_wait -1

# 與 Ghostty confirm-close-surface=false 一致。
confirm_os_window_close 0

# ── 視窗快捷鍵 ─────────────────────────────────────────────
map ctrl+shift+n launch --type=os-window --cwd=current
# 關閉整個原生視窗，包括所有分頁與分屏。
map ctrl+w close_os_window

# ── 分頁快捷鍵 ─────────────────────────────────────────────
map ctrl+shift+t launch --type=tab --cwd=current --location=after
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
# 超出分頁數的正索引會落在最右側分頁；0 / 負數則是切換歷史。
map alt+0 goto_tab 2147483647
map ctrl+shift+r set_tab_title

# ── 分屏快捷鍵 ─────────────────────────────────────────────
# 先回到 splits，讓放大分屏後仍可直接新增右側／下方分屏。
map ctrl+shift+o combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+shift+e combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+w close_window
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# kitty 以字元格調整目前分屏大小；Ghostty 的 2 是像素，幅度並不完全相同。
# 左／右縮窄／加寬，上／下加高／縮短目前分屏。
map ctrl+shift+left resize_window narrower 2
map ctrl+shift+right resize_window wider 2
map ctrl+shift+up resize_window taller 2
map ctrl+shift+down resize_window shorter 2

# ── Ghostty 常用預設快捷鍵 ──────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_selection
# 在分頁器中搜尋目前分屏的歷史輸出；預設使用 less。
map ctrl+f search_scrollback
# 使用 choose-files 模糊查找檔案，將選中的路徑插入終端。
map ctrl+shift+f kitten choose-files
map ctrl+equal change_font_size current +1.0
map ctrl+plus change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
map ctrl+0 change_font_size current 0
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
map ctrl+page_up previous_tab
map ctrl+page_down next_tab
map ctrl+shift+page_up scroll_to_prompt -1
map ctrl+shift+page_down scroll_to_prompt 1
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+enter toggle_fullscreen
map ctrl+shift+enter toggle_layout stack
map ctrl+shift+p command_palette
map ctrl+shift+q quit
map ctrl+comma edit_config_file
map ctrl+shift+comma load_config_file
